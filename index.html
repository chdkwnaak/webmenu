<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 포털</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a080c;
            --card-bg: #140f19;
            --gold: #b8860b;
            --gold-bright: #f0c040;
            --silver: #8a8fa8;
            --blood: #e74c3c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--silver);
            font-family: 'Noto Serif KR', serif;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* HEADER */
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(28px, 5vw, 42px);
            color: var(--gold-bright);
            text-shadow: 0 0 10px rgba(240, 192, 64, 0.4);
            letter-spacing: 2px;
        }
        p.subtitle {
            margin-top: 10px;
            font-size: 15px;
            color: var(--silver);
        }

        /* GRID LAYOUT */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* GAME CARD */
        .card {
            background: var(--card-bg);
            border: 1px solid rgba(184, 134, 11, 0.3);
            border-radius: 10px;
            padding: 25px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: var(--gold);
            box-shadow: 0 10px 20px rgba(184, 134, 11, 0.2);
        }
        .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        .card h2 {
            font-size: 20px;
            color: #fff;
            margin-bottom: 10px;
        }
        .card p {
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        /* BUTTON */
        .btn-play {
            display: inline-block;
            text-decoration: none;
            background: linear-gradient(135deg, #4a0a0a, #6b1212);
            color: var(--gold-bright);
            border: 1px solid var(--gold);
            padding: 10px 0;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
            transition: 0.3s;
        }
        .btn-play:hover {
            background: var(--blood);
            color: #fff;
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.5);
        }

        /* FOOTER */
        footer {
            text-align: center;
            margin-top: 60px;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>

    <header>
        <h1>WEB PORTAL</h1>
        <p class="subtitle">웹 브라우저에서 바로 실행 모음</p>
    </header>

    <main class="game-grid">
        <!-- 1. 캘린더 -->
        <div class="card">
            <div>
                <div class="icon">📆</div>
                <h2>캘린더</h2>
                <p>캘린더</p>
            </div>
            <a href="calendar.html" class="btn-play">시작</a>
        </div>

        <!-- 2. 좌표변환 -->
        <div class="card">
            <div>
                <div class="icon">📇</div>
                <h2>좌표변환기</h2>
                <p>좌표변환</p>
            </div>
            <a href="cordiconv.html" class="btn-play">시작</a>
        </div>

        <!-- 3. FORMS -->
        <div class="card">
            <div>
                <div class="icon">📝</div>
                <h2>FORMS</h2>
                <p>현장문서 통합관리</p>
            </div>
            <a href="integrated_field_forms.html" class="btn-play">시작</a>
        </div>

        <!-- 4. 체스 -->
        <div class="card">
            <div>
                <div class="icon">♟</div>
                <h2>체스</h2>
                <p>체스</p>
            </div>
            <a href="battle_chess_main.html" class="btn-play">게임 시작</a>
        </div>

        <!-- 5. 장기 -->
        <div class="card">
            <div>
                <div class="icon">🈵</div>
                <h2>장기</h2>
                <p>장기</p>
            </div>
            <a href="korean_janggi_premium.html" class="btn-play">게임 시작</a>
        </div>

        <!-- 6. 오목 -->
        <div class="card">
            <div>
                <div class="icon">⚫</div>
                <h2>오목</h2>
                <p>오목</p>
            </div>
            <a href="omok.html" class="btn-play">게임 시작</a>
        </div>

    </main>

    <footer>
        <p>© Web PORTAL. Hosted on GitHub Pages.</p>
    </footer>

</body>
</html>
